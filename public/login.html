        <div class="button-container">

  <script src="./assets/js/bootstrap.min.js"></script>
  <script src="./config.js"></script>
  <script>
    (function () {
    function withTimestamp(url) {
  try {
    const target = new URL(url, window.location.href);
    target.searchParams.set('t', Date.now().toString());
    return target.toString();
  } catch (error) {
    return url;
  }
}

function ensureFreshTimestamp() {
  try {
    const currentUrl = new URL(window.location.href);
    const rawTimestamp = (currentUrl.searchParams.get('t') || '').trim();
    const timestamp = Number(rawTimestamp);
    const isValidTimestamp = rawTimestamp !== '' && Number.isFinite(timestamp);
    if (isValidTimestamp && Math.abs(Date.now() - timestamp) <= 5000) {
      return true;
    }
    window.location.replace(withTimestamp(window.location.href));
    return false;
  } catch (error) {
    return true;
  }
}

    if (!ensureFreshTimestamp()) {
      return;
    }

    function navigate(url) {
      window.location.href = withTimestamp(url);
    }

    function showError(msg) {
      const box = document.getElementById('error-alert');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      const box = document.getElementById('error-alert');
      box.textContent = '';
      box.style.display = 'none';
    }

    document.getElementById('btn-submit').addEventListener('click', function () {
      hideError();
      const username = (document.getElementById('username').value || '').trim();
      const password = (document.getElementById('password').value || '').trim();
      if (!username) {
        showError('用户名不能为空');
        return;
      }
      if (!password) {
        showError('密码不能为空');
        return;
      }

      // 登录改由后端校验：口令不再写在前端文件里，也不在前端做比对
      const base = (window.WEB003_CONFIG && window.WEB003_CONFIG.apiBaseUrl) || '';
      const button = document.getElementById('btn-submit');
      button.disabled = true;

      fetch(base + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ username: username, password: password }),
      })
        .then(function (response) {
          return response.json().catch(function () { return null; });
        })
        .then(function (res) {
          button.disabled = false;
          if (!res || !res.ok || !res.data || !res.data.user) {
            const message = (res && res.error && res.error.message) || '用户名或密码错误';
            showError(message);
            return;
          }
          localStorage.setItem('web003_user', JSON.stringify(res.data.user));
          navigate('./index.html');
        })
        .catch(function () {
          button.disabled = false;
          showError('无法连接服务，请确认已通过 http://localhost:3000 打开本页');
        });
    });

    document.getElementById('password').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        document.getElementById('btn-submit').click();
      }
    });
    })();
  </script>
